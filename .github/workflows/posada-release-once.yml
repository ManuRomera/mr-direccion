name: Release v0.5.1 · Ejemplo con fotografía humana

on:
  push:
    branches: [main]
    paths: [".github/workflows/posada-release-once.yml"]

permissions:
  contents: write

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[PUBLISH-POSADA]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pruebas, contenido y manifest de la versión
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs
          node -e 'let m=require("./module.json"); if(m.version!=="0.5.1" || !m.download.endsWith("/v0.5.1/mr-direccion-v0.5.1.zip")) process.exit(1)'
          node scripts/zip.mjs
          test -s dist/module.json
          test -s dist/mr-direccion-v0.5.1.zip
          unzip -Z1 dist/mr-direccion-v0.5.1.zip | grep '^examples/posada/ASSET_CREDITS.md$'
          unzip -Z1 dist/mr-direccion-v0.5.1.zip | grep '^examples/posada/ASSET_SOURCES.json$'
          unzip -Z1 dist/mr-direccion-v0.5.1.zip | grep '^examples/posada/assets/camino.webp$'
      - name: Publicar los dos archivos en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.5.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::La release v0.5.1 ya existe; no se sobrescribirá."
            exit 1
          fi
          gh release create v0.5.1 \
            dist/module.json \
            dist/mr-direccion-v0.5.1.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MR · Dirección v0.5.1 — Posada con fotografía humana" \
            --notes "Actualización visual del ejemplo opcional: tres fondos, tres miniaturas y tres tokens ahora usan fotografías humanas adaptadas de Wikimedia Commons, con créditos y licencias CC BY/CC BY-SA incluidos. El módulo sigue funcionando con cualquier sistema y mundo de Foundry VTT v13. No se ha presentado todavía al catálogo oficial de Foundry."
          gh release view v0.5.1 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
